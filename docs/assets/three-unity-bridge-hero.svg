<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Three Unity Bridge</title>
  <desc id="hero-desc">An abstract data bridge connects a Three.js mesh to a Unity runtime scene.</desc>

  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1510" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B1022"/>
      <stop offset="1" stop-color="#120B24"/>
    </linearGradient>
    <radialGradient id="cyan-haze" cx="0" cy="0" r="1" gradientTransform="translate(337 351) rotate(14) scale(408 325)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-haze" cx="0" cy="0" r="1" gradientTransform="translate(1262 365) rotate(161) scale(428 337)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="375" y1="0" x2="1225" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bridge-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mesh-face" x1="235" y1="275" x2="420" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="1216" y1="286" x2="1353" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wide-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="640" rx="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#bg)"/>
    <rect width="1600" height="640" fill="url(#grid)"/>
    <ellipse cx="334" cy="358" rx="420" ry="330" fill="url(#cyan-haze)"/>
    <ellipse cx="1270" cy="366" rx="440" ry="338" fill="url(#violet-haze)"/>
    <path d="M0 550C332 492 551 596 800 542C1070 484 1310 578 1600 515V640H0V550Z" fill="#020617" fill-opacity="0.3"/>
    <path d="M84 520H1516" stroke="#CBD5E1" stroke-opacity="0.09"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
      <text x="800" y="78" fill="#67E8F9" font-size="14" font-weight="700" letter-spacing="5">THREE-UNITY BRIDGE</text>
      <text x="800" y="148" fill="#F8FAFC" font-size="58" font-weight="650" letter-spacing="1">PRESERVE THE WEB</text>
      <text x="800" y="186" fill="#94A3B8" font-size="18" font-weight="500" letter-spacing="4">MOVE THE RIGHT RUNTIME</text>
    </g>

    <!-- Three.js side: an original low-poly data object. -->
    <g stroke="#67E8F9" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="320" cy="382" rx="150" ry="62" stroke-opacity="0.18" stroke-dasharray="3 10"/>
      <ellipse cx="320" cy="382" rx="84" ry="146" transform="rotate(58 320 382)" stroke-opacity="0.12"/>
      <path d="M215 355L258 271L349 248L424 311L433 403L370 480L278 488L207 423L215 355Z" fill="url(#mesh-face)" stroke-opacity="0.65" stroke-width="1.5"/>
      <path d="M258 271L292 343L215 355M349 248L292 343L424 311M292 343L342 397L433 403M292 343L244 420L207 423M342 397L370 480M342 397L278 488M244 420L278 488M244 420L342 397" stroke-opacity="0.55"/>
      <path d="M215 355L292 343L349 248M292 343L278 488M424 311L342 397L370 480" stroke-opacity="0.32"/>
      <g fill="#CFFAFE" stroke="none" filter="url(#soft-glow)">
        <circle cx="258" cy="271" r="3"/>
        <circle cx="349" cy="248" r="3"/>
        <circle cx="424" cy="311" r="3"/>
        <circle cx="433" cy="403" r="3"/>
        <circle cx="370" cy="480" r="3"/>
        <circle cx="278" cy="488" r="3"/>
        <circle cx="207" cy="423" r="3"/>
        <circle cx="215" cy="355" r="3"/>
        <circle cx="292" cy="343" r="4"/>
        <circle cx="342" cy="397" r="4"/>
        <circle cx="244" cy="420" r="3"/>
      </g>
    </g>

    <!-- Bridge: two luminous arches carry a bounded, ordered signal. -->
    <path d="M438 405C562 405 590 286 702 286H898C1010 286 1038 405 1162 405" stroke="#22D3EE" stroke-opacity="0.11" stroke-width="18" filter="url(#wide-glow)"/>
    <path d="M438 405C562 405 590 286 702 286H898C1010 286 1038 405 1162 405" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
    <path d="M438 430C570 430 616 326 710 326H890C984 326 1030 430 1162 430" stroke="url(#signal)" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 9"/>
    <path d="M574 385V478M648 316V478M952 316V478M1026 385V478" stroke="#94A3B8" stroke-opacity="0.2"/>
    <path d="M534 478H1066" stroke="#94A3B8" stroke-opacity="0.25"/>
    <path d="M619 478H681M919 478H981" stroke="url(#signal)" stroke-opacity="0.8" stroke-width="3"/>

    <g filter="url(#soft-glow)">
      <circle cx="514" cy="390" r="4" fill="#67E8F9"/>
      <circle cx="606" cy="315" r="4" fill="#67E8F9"/>
      <circle cx="994" cy="341" r="4" fill="#A78BFA"/>
      <circle cx="1098" cy="404" r="4" fill="#C4B5FD"/>
    </g>
    <path d="M466 398L476 405L466 412M1124 398L1134 405L1124 412" stroke="url(#signal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(800 312)">
      <path d="M0-64L55-32V32L0 64L-55 32V-32L0-64Z" fill="url(#bridge-fill)" stroke="url(#signal)" stroke-width="2"/>
      <path d="M0-50L43-25V25L0 50L-43 25V-25L0-50Z" stroke="#E2E8F0" stroke-opacity="0.2"/>
      <circle r="7" fill="#F8FAFC" filter="url(#soft-glow)"/>
      <path d="M-31 0H-9M9 0H31" stroke="#F8FAFC" stroke-opacity="0.65" stroke-width="2"/>
    </g>

    <!-- Unity side: an original runtime scene made from nested volumes. -->
    <g stroke="#C4B5FD" stroke-linejoin="round">
      <path d="M1223 299L1297 258L1377 302L1301 345L1223 299Z" fill="url(#cube-top)" stroke-opacity="0.8" stroke-width="1.5"/>
      <path d="M1223 299L1301 345V438L1223 391V299Z" fill="#7C3AED" fill-opacity="0.08" stroke-opacity="0.45"/>
      <path d="M1301 345L1377 302V395L1301 438V345Z" fill="#A78BFA" fill-opacity="0.13" stroke-opacity="0.65"/>
      <path d="M1254 317L1297 293L1344 318L1300 343L1254 317Z" fill="#DDD6FE" fill-opacity="0.08" stroke-opacity="0.34"/>
      <path d="M1254 317V366L1300 393L1344 368V318" stroke-opacity="0.24"/>
      <path d="M1191 417L1301 481L1410 419" stroke-opacity="0.2"/>
      <path d="M1191 444L1301 508L1410 446" stroke-opacity="0.12"/>
      <path d="M1174 341L1198 327L1223 342L1198 356L1174 341ZM1381 367L1405 353L1430 368L1405 382L1381 367Z" fill="#8B5CF6" fill-opacity="0.12" stroke-opacity="0.48"/>
      <path d="M1198 356V390M1405 382V416" stroke-opacity="0.3"/>
      <g fill="#EDE9FE" stroke="none" filter="url(#soft-glow)">
        <circle cx="1297" cy="258" r="3"/>
        <circle cx="1377" cy="302" r="3"/>
        <circle cx="1301" cy="438" r="3"/>
        <circle cx="1223" cy="391" r="3"/>
      </g>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
      <text x="320" y="562" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="4">THREE.JS</text>
      <text x="320" y="588" fill="#64748B" font-size="12" font-weight="600" letter-spacing="2">WEB EXPERIENCE</text>
      <text x="800" y="410" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="3">BRIDGE</text>
      <text x="1300" y="562" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="4">UNITY</text>
      <text x="1300" y="588" fill="#64748B" font-size="12" font-weight="600" letter-spacing="2">RUNTIME SYSTEMS</text>
    </g>

    <rect x="0.75" y="0.75" width="1598.5" height="638.5" rx="31.25" stroke="#E2E8F0" stroke-opacity="0.13" stroke-width="1.5"/>
  </g>
</svg>
